---

- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: "{{ k3s_install_bin }}"
  register: k3s_bin

- name: Get the installed k3s version
  ansible.builtin.command: "{{ k3s_install_bin }} --version"
  register: k3s_installed_version
  changed_when: false
  check_mode: false
  when: k3s_bin.stat.exists

- name: Install or upgrade k3s server
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" INSTALL_K3S_EXEC="server {{ k3s_server_install_args }}" sh -
  when: not k3s_bin.stat.exists or k3s_version not in k3s_installed_version.stdout
  changed_when: true

- name: Wait for the k3s node to be Ready
  ansible.builtin.command: "{{ k3s_install_bin }} kubectl wait --for=condition=Ready node --all --timeout=180s"
  changed_when: false

- name: Wait for the node token to be written
  ansible.builtin.wait_for:
    path: "{{ k3s_node_token_path }}"
    timeout: 60

- name: Read the node token
  ansible.builtin.slurp:
    src: "{{ k3s_node_token_path }}"
  register: k3s_node_token_raw

- name: Expose the node token to other plays in this run
  ansible.builtin.set_fact:
    k3s_node_token: "{{ (k3s_node_token_raw.content | b64decode).strip() }}"
