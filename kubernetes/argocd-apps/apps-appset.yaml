apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/spicyFajitas/cookbooks.git
        revision: HEAD
        directories:
          - path: kubernetes/apps/*
          - path: kubernetes/apps/_template
            exclude: true
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/source/kustomize
        - /spec/syncPolicy
  template:
    metadata:
      name: "{{path.basename}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/spicyFajitas/cookbooks.git
        targetRevision: main
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{path.basename}}"
      # mc-router (kubernetes/apps/mc-router/) scales the Minecraft
      # servers' StatefulSets between 0 and 1 on demand. Their manifests
      # don't set replicas, and this keeps Argo (selfHeal or a sync) from
      # ever treating mc-router's value as drift -- same idea as
      # platform-cloudflared.yaml's ignoreDifferences.
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          name: minecraft
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
