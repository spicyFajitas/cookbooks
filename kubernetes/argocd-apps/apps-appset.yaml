apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/spicyFajitas/cookbooks.git
        revision: HEAD
        directories:
          - path: kubernetes/apps/*
          - path: kubernetes/apps/_template
            exclude: true
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/source/kustomize
  template:
    metadata:
      name: "{{path.basename}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/spicyFajitas/cookbooks.git
        targetRevision: HEAD
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{path.basename}}"
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
