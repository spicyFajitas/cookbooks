# Overrides for k3s's *bundled* Traefik -- not a Traefik install of our
# own. k3s deploys Traefik itself via its HelmChart controller
# (kube-system/helmchart/traefik, chart traefik-40.1.3+up40.1.0 as of
# 2026-10); a HelmChartConfig with the same name/namespace is k3s's
# supported way to layer extra values on top of that chart without
# disabling or forking it. k3s's own valuesContent (image, tolerations,
# podAnnotations, ...) stays as-is -- these values merge over it.
#
# k3s-only: HelmChartConfig is a k3s CRD. On DOKS (or anything else) this
# manifest does nothing useful -- exclude this Application there, same
# blunt approach as monitoring (see .claude-plan.md's "No per-cluster
# targeting mechanism exists yet").
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    logs:
      access:
        # JSON to stdout -> Alloy (kubernetes/platform/loki/02-alloy.yaml)
        # already ships every pod's logs to Loki, so these land there with
        # no extra plumbing. Query with `{namespace="kube-system",
        # container="traefik"} | json`.
        enabled: true
        format: json
        fields:
          headers:
            # Header names are Go-canonicalized (Cf-Ipcountry, not
            # CF-IPCountry) -- they show up in the log line as
            # request_<Name>. Everything else stays dropped: no cookies or
            # auth headers in Loki.
            defaultmode: drop
            names:
              # Real visitor IP. ClientHost in the log line is always the
              # cloudflared pod's IP, since every request arrives through
              # the tunnel (kubernetes/platform/cloudflared/).
              Cf-Connecting-Ip: keep
              # 2-letter country code, added free by Cloudflare's edge
              Cf-Ipcountry: keep
              User-Agent: keep
              Referer: keep
    metrics:
      prometheus:
        # k3s already runs Traefik with --metrics.prometheus=true on :9100,
        # but no Service exposes that port. This adds a ClusterIP
        # `traefik-metrics` Service so Prometheus can use a static target
        # (kubernetes/platform/monitoring/01-prometheus.yaml's `traefik`
        # job), same style as every other scrape job there.
        service:
          enabled: true
