# One Schedule per namespace that has data worth keeping. k8up backs up
# every PVC in the namespace unless the PVC is annotated
# `k8up.io/backup: "false"`. The endpoint, credentials and repository
# password come from the operator's global settings (values.yaml). Each
# namespace gets its own bucket, which restic creates on first run.
#
# 01:30 nightly, so it's done before the 03:00 Proxmox VM backup. Minecraft
# servers are almost always scaled to 0 by then, so the world files aren't
# changing while they're copied. `monitoring` is left out on purpose:
# Prometheus and Loki data can be rebuilt.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
  namespace: magic
spec:
  backend:
    s3:
      bucket: k8up-magic
  backup:
    schedule: "30 1 * * *"
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 3
  check:
    schedule: "0 5 * * 0"
  prune:
    schedule: "0 4 * * 0"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 3
---
