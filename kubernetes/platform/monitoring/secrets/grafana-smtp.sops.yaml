apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
  name: grafana-smtp
  namespace: monitoring
spec:
  secretTemplates:
    - name: grafana-smtp
      stringData:
        GF_SMTP_USER: "REPLACE_WITH_REAL_VALUE"
        GF_SMTP_PASSWORD: "REPLACE_WITH_REAL_VALUE"
        GF_SMTP_FROM_ADDRESS: "REPLACE_WITH_REAL_VALUE"
        ALERT_EMAIL_TO: "REPLACE_WITH_REAL_VALUE"
