# No external-dns annotations -- DNS comes from the *.spicyfajitas.com
# tunnel wildcard (kubernetes/platform/cloudflared/02-wildcard-dns.yaml),
# same as kubernetes/apps/magic/04-ingress.yaml. Tried monitoring's
# external-dns-managed + tunnel `target` pattern first (2026-11): the
# running external-dns ignores the target annotation and publishes the
# Ingress's LAN address (10.100.10.12) as an unproxied A record instead.
# Grafana/homepage only work because pre-existing CNAMEs block that
# write (external-dns logs show it failing every minute for both).
#
# No auth in front of this beyond Speedtest Tracker's own login (users
# came over with the database migration) -- same stance as Grafana.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: speedtest-tracker
  namespace: speedtest-tracker
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Speedtest Tracker
    gethomepage.dev/description: WAN speed history
    gethomepage.dev/group: Services
    gethomepage.dev/pod-selector: app=speedtest-tracker
    gethomepage.dev/icon: speedtest-tracker.png
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - speedtest.spicyfajitas.com
      secretName: speedtest-tracker-tls
  rules:
    - host: speedtest.spicyfajitas.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: speedtest-tracker
                port:
                  name: web
