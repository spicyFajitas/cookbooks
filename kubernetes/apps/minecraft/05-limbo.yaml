# Holding server for Velocity's failover: an empty void world (NanoLimbo)
# where players wait while Paper restarts, then `/server paper` to go back.
#
# No world, no state (emptyDir), cluster-internal only. Runs with no info
# forwarding, i.e. offline mode -- fine for a void with nothing to do or
# protect, and the ClusterIP Service means only Velocity can reach it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: limbo
  namespace: minecraft-grass-gang
  labels:
    app: limbo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: limbo
  template:
    metadata:
      labels:
        app: limbo
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: limbo
          image: itzg/minecraft-server:java25
          ports:
            - name: minecraft
              containerPort: 25565
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: NANOLIMBO
            - name: MEMORY
              value: 128M
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: limbo
  namespace: minecraft-grass-gang
  labels:
    app: limbo
spec:
  selector:
    app: limbo
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
