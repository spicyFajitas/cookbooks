# Holding server for Velocity's failover: an empty void world (NanoLimbo)
# where players wait while Paper restarts, then `/server paper` to go back.
#
# No world, no state (emptyDir), cluster-internal only.
#
# Uses Velocity modern forwarding like Paper does: Velocity in modern mode
# refuses to hand players to any backend that doesn't request forwarding
# ("Your server did not send a forwarding request to the proxy"), so a
# plain offline-mode limbo doesn't work. The init container writes
# config/nanolimbo-settings.yml into place with the secret filled in.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: limbo
  namespace: minecraft
  labels:
    app: limbo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: limbo
  template:
    metadata:
      labels:
        app: limbo
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # NanoLimbo only writes its default settings.yml when the file is
        # missing, so laying ours down first (fresh emptyDir every start)
        # means it's always used as-is.
        - name: settings
          image: mikefarah/yq:4.44.3
          command:
            - sh
            - -c
            - |
              set -e
              yq '
                .infoForwarding.type = "MODERN" |
                .infoForwarding.secret = strenv(VELOCITY_SECRET)
              ' /seed/settings.yml > /data/settings.yml
              echo "wrote /data/settings.yml with MODERN forwarding"
          env:
            - name: VELOCITY_SECRET
              valueFrom:
                secretKeyRef:
                  name: velocity-forwarding
                  key: forwarding.secret
          volumeMounts:
            - name: data
              mountPath: /data
            - name: settings
              mountPath: /seed
      containers:
        - name: limbo
          image: itzg/minecraft-server:java25
          ports:
            - name: minecraft
              containerPort: 25565
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: NANOLIMBO
            - name: MEMORY
              value: 128M
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          emptyDir: {}
        - name: settings
          configMap:
            name: limbo-settings
---
apiVersion: v1
kind: Service
metadata:
  name: limbo
  namespace: minecraft
  labels:
    app: limbo
spec:
  selector:
    app: limbo
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
