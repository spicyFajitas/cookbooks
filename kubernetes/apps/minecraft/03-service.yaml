# Paper's backend Service. Cluster-internal only: players come in through
# Velocity (04-velocity.yaml), which owns the public 25565 on the k3s node.
# Paper runs in offline mode behind the proxy, so it must NOT be reachable
# directly -- Velocity modern forwarding also rejects any login that didn't
# come through the proxy, as a second guard.
#
# Also what homepage's Minecraft widget pings for status/player count.
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft-grass-gang
  labels:
    app: minecraft
spec:
  selector:
    app: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
