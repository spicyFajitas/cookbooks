# ClusterIP only -- players reach this through mc-router
# (kubernetes/apps/mc-router/), which owns :25565 on the node and routes
# minecraft.spicyfajitas.com (and any unmatched hostname / raw IP) here.
#
# Also what homepage's Minecraft widget pings for status/player count.
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  type: ClusterIP
  selector:
    app: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
