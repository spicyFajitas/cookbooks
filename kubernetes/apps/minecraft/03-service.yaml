# Minecraft is raw TCP, so it can't go through Traefik/Ingress or the
# Cloudflare tunnel like the web apps. LoadBalancer here is handled by
# k3s's built-in ServiceLB (same mechanism as svclb-traefik), which binds
# 25565 on the k3s node itself -- players reach it at 10.100.10.12:25565
# (router port forward), or minecraft.spicyfajitas.com (06-public-dns.yaml).
#
# Also what homepage's Minecraft widget pings for status/player count.
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  type: LoadBalancer
  selector:
    app: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
