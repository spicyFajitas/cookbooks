# secrets/*.sops.yaml deliberately NOT listed -- same
# reasoning as kubernetes/apps/homepage/kustomization.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 01-pvc.yaml
  - 02-deployment.yaml
  - 03-service.yaml
  - 04-velocity.yaml
  - 05-limbo.yaml
  - 06-public-dns.yaml

configMapGenerator:
  - name: velocity-config
    namespace: minecraft-grass-gang
    files:
      - velocity.toml=config/velocity.toml
  - name: limbo-settings
    namespace: minecraft-grass-gang
    files:
      - settings.yml=config/nanolimbo-settings.yml
  - name: axgraves-config
    namespace: minecraft-grass-gang
    files:
      - config.yml=config/axgraves-config.yml
