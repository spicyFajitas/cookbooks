# secrets/*.sops.yaml deliberately NOT listed -- same
# reasoning as kubernetes/apps/homepage/kustomization.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 01-pvc.yaml
  - 02-statefulset.yaml
  - 03-service.yaml
  - 06-public-dns.yaml

configMapGenerator:
  - name: axgraves-config
    namespace: minecraft
    files:
      - config.yml=config/axgraves-config.yml
