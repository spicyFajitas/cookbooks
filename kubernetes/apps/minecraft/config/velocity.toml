# Velocity proxy config. Kustomize turns this into the velocity-config
# ConfigMap; itzg/mc-proxy syncs /config into /server on every start, so
# edit it here, not in the pod.
config-version = "2.7"

bind = "0.0.0.0:25577"
motd = "<green>K3s Paper Server"
show-max-players = 20

# The proxy does the Mojang auth; Paper sits behind it in offline mode and
# trusts the identity Velocity forwards (signed with forwarding.secret).
online-mode = true
force-key-authentication = true
prevent-client-proxy-connections = false
player-info-forwarding-mode = "modern"
forwarding-secret-file = "forwarding.secret"

announce-forge = false
kick-existing-players = false
# Server list shows Paper's MOTD/player count while it's up, Velocity's
# own motd above while it's restarting.
ping-passthrough = "all"
enable-player-address-logging = true

[servers]
paper = "minecraft.minecraft.svc.cluster.local:25565"
limbo = "limbo.minecraft.svc.cluster.local:25565"
# Join order, and where failover-on-unexpected-server-disconnect sends
# players when Paper restarts. Back to Paper with `/server paper`.
try = ["paper", "limbo"]

[forced-hosts]

[advanced]
compression-threshold = 256
compression-level = -1
login-ratelimit = 3000
connection-timeout = 5000
read-timeout = 30000
haproxy-protocol = false
tcp-fast-open = false
bungee-plugin-message-channel = true
show-ping-requests = false
failover-on-unexpected-server-disconnect = true
announce-proxy-commands = true
log-command-executions = false
log-player-connections = true
accepts-transfers = false

[query]
enabled = false
port = 25577
map = "Velocity"
show-plugins = false
