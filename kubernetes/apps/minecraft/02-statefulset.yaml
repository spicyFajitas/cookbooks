apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  # No `replicas:` on purpose -- mc-router owns it (0 when idle, 1 when a
  # player connects). Argo ignores the field too
  # (kubernetes/argocd-apps/apps-appset.yaml), so a sync never wakes it.
  # StatefulSet, not Deployment, because that's the only kind mc-router
  # can scale; it finds this by name, so name == serviceName == the
  # Service's name.
  serviceName: minecraft
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      # Gives the server time to save the world on shutdown/redeploy.
      terminationGracePeriodSeconds: 120
      initContainers:
        # Same job as the role's template tasks for plugin configs: lay
        # them down over whatever the plugin last wrote, on every start.
        # Copied, not mounted, because plugins rewrite their own configs
        # and a ConfigMap/Secret mount is read-only.
        - name: plugin-configs
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              set -e
              install -D -m 0664 -o 1000 -g 1000 /seed/axgraves/config.yml /data/plugins/AxGraves/config.yml
              install -m 0664 -o 1000 -g 1000 /seed/permissions/permissions.yml /data/permissions.yml
              install -D -m 0664 -o 1000 -g 1000 /seed/oldcombatmechanics/config.yml /data/plugins/OldCombatMechanics/config.yml
              # install -D creates missing parent dirs as root (only the
              # file gets -o/-g), and the plugins (uid 1000) need to write
              # their data next to their config.
              chown 1000:1000 /data/plugins /data/plugins/AxGraves /data/plugins/OldCombatMechanics

              # MCXboxBroadcast: Geyser extension that shows this server
              # in Xbox friends' "Joinable" list -- consoles can't add a
              # custom server address, this is how they get in. Geyser
              # extensions live in Geyser's own extensions/ dir, which the
              # image's MODRINTH_PROJECTS can't target, so fetch it here.
              # Pinned build 165 (uryWwQoA); busybox wget doesn't verify
              # TLS, so the sha512 check is what guarantees the jar.
              ext=/data/plugins/Geyser-Spigot/extensions
              jar=$ext/MCXboxBroadcastExtension.jar
              sum=11ffbf5c59f6a0a22fde75f917a7fb41eca66238d0fbfbcc773cd298cc8e4d763e43595b0045a0566e5a54484734a716db5caf5c4373c0839ca69d8b252bd4ba
              if ! echo "$sum  $jar" | sha512sum -c -s 2>/dev/null; then
                mkdir -p $ext
                wget -q -O $jar.tmp https://cdn.modrinth.com/data/Vcl7t1Oa/versions/uryWwQoA/MCXboxBroadcastExtension.jar
                echo "$sum  $jar.tmp" | sha512sum -c -s
                mv $jar.tmp $jar
              fi
              chown -R 1000:1000 /data/plugins/Geyser-Spigot
          volumeMounts:
            - name: data
              mountPath: /data
            - name: axgraves-config
              mountPath: /seed/axgraves
            - name: bukkit-permissions
              mountPath: /seed/permissions
            - name: oldcombatmechanics-config
              mountPath: /seed/oldcombatmechanics
      containers:
        - name: minecraft
          image: itzg/minecraft-server:java25
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: minecraft
              containerPort: 25565
            # Geyser's Bedrock listener (04-bedrock-service.yaml).
            - name: bedrock
              containerPort: 19132
              protocol: UDP
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: PAPER
            - name: VERSION
              value: "26.3"
            # thizzyz-tree-feller: break one log with an axe, whole tree
            # falls. Pinned to 1.33.0's version id (bPFqoFvZ) -- the same
            # jar was dropped into plugins/ by hand on 2026-11-08 so it
            # could load without restarting; unpinned, the image could
            # fetch a newer TreeFeller-*.jar next to it (duplicate plugin).
            # smartsort: click/command to sort chests and inventories.
            # crouch-grow: crouching near crops grows them (costs hunger).
            # scythe: right-click a grown crop to harvest + replant, and
            # crops broken normally replant too (crouch to break without
            # replanting; /scythe toggle per player). Replaced auto-replant
            # -- running both double-handles the same crop.
            # itemquickstack: /qs stack puts matching items into nearby
            # chests. Pinned to 1.0.1 (zpkQL0LX) because no release lists
            # 26.3, so an unpinned lookup finds nothing. Players get its
            # permission via config/permissions.yml.
            # geyser + floodgate (PLUGINS below): Bedrock/Xbox players join
            # on UDP 19132 without a Java account. Geyser is left unpinned
            # on purpose -- Bedrock clients auto-update and an old Geyser
            # locks them out. Floodgate's Paper build isn't on Modrinth,
            # so it comes from GeyserMC's own download API, pinned to
            # 2.2.5 build 141 (its 26.3 update). Bedrock names show up
            # with a "." prefix; whitelist them with /fwhitelist add.
            # OldCombatMechanics (PLUGINS below): no attack cooldown, so
            # spam-clicking does full damage; sword sweep is off too.
            # Everything else stays modern -- see
            # config/oldcombatmechanics-config.yml. Not on Modrinth, so
            # it's the pinned v2.8.1 GitHub release jar.
            # veinminer: break one ore, the whole connected vein breaks
            # (ores + pickaxes by default; tune in-game with
            # /veinminer settings). Turn its autoUpdate off -- the image
            # already fetches the latest on start, and both updating can
            # leave two jars in plugins/.
            - name: MODRINTH_PROJECTS
              value: |
                axgraves
                thizzyz-tree-feller:bPFqoFvZ
                bluemap
                smartsort
                crouch-grow
                scythe
                itemquickstack:zpkQL0LX
                veinminer
                geyser
            - name: PLUGINS
              value: |
                https://download.geysermc.org/v2/projects/floodgate/versions/2.2.5/builds/141/downloads/spigot
                https://github.com/kernitus/BukkitOldCombatMechanics/releases/download/v2.8.1/OldCombatMechanics.jar
            - name: DIFFICULTY
              value: normal
            - name: VIEW_DISTANCE
              value: "15"
            # 0 = no spawn protection; anyone can build at spawn.
            - name: SPAWN_PROTECTION
              value: "0"
            - name: MOTD
              value: K3s Paper Server
            - name: INIT_MEMORY
              value: 2G
            - name: MAX_MEMORY
              value: 4G
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: TZ
              value: America/Los_Angeles
            - name: ONLINE_MODE
              value: "TRUE"
            - name: EXISTING_OPS_FILE
              value: SYNCHRONIZE
            # UUIDs, one per line: spicy_Fajitas
            - name: OPS
              value: |
                83fa4fe0-0e0e-42c0-8bec-97cc58148295
            - name: ENABLE_WHITELIST
              value: "TRUE"
            - name: ENFORCE_WHITELIST
              value: "TRUE"
            - name: EXISTING_WHITELIST_FILE
              value: MERGE
            - name: WHITELIST
              value: |
                83fa4fe0-0e0e-42c0-8bec-97cc58148295
                eef23291-c945-4ae4-a580-ec11e330f2c1
                cc585f9d-0aea-45c8-b7b4-95bdb92c95a8
                def8f26e-c4fb-4737-81a2-ec051747c8f3
                d006aac0-8dfb-4938-b854-6118bdfe65e2
                8a9997b1-eb9e-419a-a83d-ca9329d1954d
                266f26ee-3305-44df-b4c0-06b5915ffd01
                6180fd8a-8c03-4c3e-85cd-4b434defa251
                a4ae9bd6-90a0-44fd-93a0-b336db7cc964
                1edb14d7-9d91-470e-893a-c263c253e071
                5b502011-d014-49d0-bee2-70f7bf93e591
                f51f109a-82f1-4ea5-8bf0-37da9d11ec92
                721526ef-e8b3-4e36-bb23-951fcbc7a72b
                f9827bf9-a772-487c-ab89-235b4f0b0bd6
                fa6d1295-6282-4f7f-84c7-ea6599a4ec55
                86234888-3f78-4733-8049-02a7e910fde2
                c51624b9-e590-475f-a408-48f103b94bb1
                1fdb22af-75f2-426e-8aeb-3557b4d3258c
                1ff5dba2-c3fc-4bae-aec0-31b3065f9d98
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              memory: 6Gi
          startupProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 30
            failureThreshold: 4
          readinessProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
        - name: axgraves-config
          configMap:
            name: axgraves-config
        - name: bukkit-permissions
          configMap:
            name: bukkit-permissions
        - name: oldcombatmechanics-config
          configMap:
            name: oldcombatmechanics-config
