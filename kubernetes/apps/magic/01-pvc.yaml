apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edhrec-analyzer-cache
  namespace: magic
  annotations:
    # Cache, rebuilt on demand -- not worth backing up (k8up).
    k8up.io/backup: "false"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edhrec-analyzer-output
  namespace: magic
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
