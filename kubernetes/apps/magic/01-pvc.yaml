apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edhrec-analyzer-cache
  namespace: magic
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edhrec-analyzer-output
  namespace: magic
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
