apiVersion: v1
kind: Service
metadata:
  name: edhrec-analyzer
  namespace: magic
  labels:
    app: edhrec-analyzer
spec:
  type: ClusterIP
  selector:
    app: edhrec-analyzer
  ports:
    - name: web
      port: 8501
      targetPort: web
---
apiVersion: v1
kind: Service
metadata:
  name: edhrec-analyzer-metrics
  namespace: magic
  labels:
    app: edhrec-analyzer
spec:
  type: NodePort
  selector:
    app: edhrec-analyzer
  ports:
    - name: metrics
      port: 8502
      targetPort: metrics
      nodePort: 30852
