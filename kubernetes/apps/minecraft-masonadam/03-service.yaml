# ClusterIP only -- players reach this through mc-router
# (kubernetes/apps/mc-router/), which owns :25565 on the node and routes
# by the hostname the client connected with.
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft-masonadam
  labels:
    app: minecraft
spec:
  selector:
    app: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
