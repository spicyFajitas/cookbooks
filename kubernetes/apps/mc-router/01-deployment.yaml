# Hostname-based router for every Minecraft (Java) server on the cluster.
# Java clients send the hostname they dialed in the handshake, so one
# public :25565 can front any number of servers -- mc-router reads that
# and proxies the TCP stream to the matching backend Service.
#
# Backends are discovered from Service annotations
# (mc-router.itzg.me/externalServerName, .../defaultServer), not a static
# list here, and each server's same-named StatefulSet is scaled on demand:
#   - 0 -> 1 when a player logs in. 1.47.2 holds the login while the
#     server boots, but the Java client gives up after ~30s and these
#     servers take ~20-55s, so the first joiner may need to rejoin once.
#   - 1 -> 0 after AUTO_SCALE_DOWN_AFTER with nobody connected. Server-list
#     pings don't reset that timer, only logins do.
#
# Adding a server: StatefulSet + Service both named `minecraft` (or any
# matching name/serviceName pair), annotate the Service with its
# hostname, and add the hostname to the DDNS updater's DOMAINS
# (kubernetes/apps/minecraft/06-public-dns.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-router
  namespace: mc-router
  labels:
    app: mc-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mc-router
  template:
    metadata:
      labels:
        app: mc-router
    spec:
      serviceAccountName: mc-router
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: mc-router
          image: itzg/mc-router:1.47.2
          env:
            # Watch Services (all namespaces) for mc-router.itzg.me/*
            # annotations instead of a static MAPPING.
            - name: IN_KUBE_CLUSTER
              value: "true"
            - name: AUTO_SCALE_UP
              value: "true"
            - name: AUTO_SCALE_DOWN
              value: "true"
            - name: AUTO_SCALE_DOWN_AFTER
              value: 15m
            # What the multiplayer server list shows while a server sleeps
            # (empty would make it look dead/unreachable).
            - name: AUTO_SCALE_ASLEEP_MOTD
              value: "Sleeping -- join to wake server (may take 1-3 minutes to start)"
          ports:
            - name: minecraft
              containerPort: 25565
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
