# Hostname-based router for every Minecraft (Java) server on the cluster.
# Java clients send the hostname they dialed in the handshake, so one
# public :25565 can front any number of servers -- mc-router reads that
# and proxies the TCP stream to the matching backend Service.
#
# Adding a server: give it a ClusterIP Service on 25565, add a
# host=backend entry to MAPPING below, and add the hostname to the DDNS
# updater's DOMAINS (kubernetes/apps/minecraft/06-public-dns.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-router
  namespace: mc-router
  labels:
    app: mc-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mc-router
  template:
    metadata:
      labels:
        app: mc-router
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: mc-router
          image: itzg/mc-router:1.47.2
          env:
            - name: MAPPING
              value: >-
                minecraft.spicyfajitas.com=minecraft.minecraft.svc.cluster.local:25565,
                gg.spicyfajitas.com=minecraft.minecraft-grass-gang.svc.cluster.local:25565,
                masonadam.spicyfajitas.com=minecraft.minecraft-masonadam.svc.cluster.local:25565
            # Anything that doesn't match a mapping (e.g. connecting by raw
            # IP, 10.100.10.12:25565) lands on the 26.3 server.
            - name: DEFAULT
              value: minecraft.minecraft.svc.cluster.local:25565
          ports:
            - name: minecraft
              containerPort: 25565
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
