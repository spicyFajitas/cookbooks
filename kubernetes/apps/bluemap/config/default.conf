# Static BlueMap web viewer, served straight off a Minecraft server's PVC
# (BlueMap "file" storage), so the map stays up while the server sleeps.
# Based on BlueMap's documented external-webserver setup for file storage.
server {
    listen 8080;
    root /srv/bluemap/web;
    index index.html;

    # BlueMap ships sql.php for its SQL-storage mode; not used here.
    location ~ \.php$ {
        return 404;
    }

    # Live data (player positions, markers) only exists while the server
    # is awake -- proxy to its built-in webserver, and answer "no content"
    # instead of an error while it's asleep. Never goes through mc-router,
    # so viewing the map can't wake a server.
    location ~* ^/maps/[^/]+/live/ {
        proxy_pass http://bluemap-live:8100;
        proxy_connect_timeout 2s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @empty;
    }

    # Hi-res tiles (.prbm) and textures.json are stored pre-gzipped as
    # *.gz. Tiles that were never rendered are a normal "nothing here".
    location ~* ^/maps/[^/]+/tiles/ {
        gzip_static always;
        gunzip on;
        error_page 404 = @empty;
    }

    location /maps/ {
        gzip_static always;
        gunzip on;
    }

    location @empty {
        return 204;
    }
}
